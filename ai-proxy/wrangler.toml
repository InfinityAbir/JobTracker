name = "job-tracker-ai"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Public endpoint only; no per-version preview URLs.
workers_dev = true
preview_urls = false

# Per Cloudflare location, best-effort. Period must be 10 or 60 seconds.
[[ratelimits]]
name = "DEVICE_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 6
  period = 60

[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 30
  period = 60
